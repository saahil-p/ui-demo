spring:
  application:
    name: product-service
  
  data:
    mongodb:
      uri: mongodb://localhost:27017/ecommerce
      database: ecommerce
  
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    com.ecommerce: DEBUG
    org.springframework.data.mongodb: DEBUG

